# Benchmark overlay — used as: dsh headless --patch benchmark/model-overlay.yml
# Identical runs for both models; the model comes from $BENCH_MODEL so the
# methodology differs by exactly one variable. Credentials resolve through the
# global DSH credentials store via the apiKeyEnv reference (never this file).
- id: llm-pi-ai
  config:
    providers:
      xiaomi-token-plan-sgp:
        apiKeyEnv: XIAOMI_TOKEN_PLAN_SGP_API_KEY
        # Effort A/B support: the live profile only maps the levels the
        # pipeline uses (off/high); declare all four for BOTH models so the
        # harness accepts off/low/medium/high identically across the sweep.
        # Mapping copied from config/cordis.patch.yml.example (verified).
        models:
          - id: mimo-v2.6-flash
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
          - id: mimo-v2.6-pro
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
- id: agent-default-model
  config:
    provider: xiaomi-token-plan-sgp
    model: !!js process.env.BENCH_MODEL || 'mimo-v2.6-flash'
    # Effort A/B (benchmark/run.mjs BENCH_EFFORTS): unset -> adapter default,
    # otherwise the harness effort id (off/low/medium/high) for every run.
    reasoningEffort: !!js process.env.BENCH_EFFORT || undefined
# The headless template disables credentials-local; the stored provider key
# lives in the global credentials service (the web Models page writes it).
- id: credentials
  disabled: false
